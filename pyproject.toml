[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventbroker-lite"
version = "0.1.0"
description = "A lightweight typed in-process event broker with pub/sub and optional SQLite persistence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Axel Gustav Lindstrom", email = "Axelgustavlindstrom@gmail.com" }]
keywords = ["events", "pubsub", "broker", "local"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/eventbroker"]
